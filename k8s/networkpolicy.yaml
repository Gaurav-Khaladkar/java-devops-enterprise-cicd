apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: java-devops-network-policy
  namespace: devops-production
  labels:
    app.kubernetes.io/name: java-devops-application
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: java-devops-application
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic on port 8080 from ingress namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound database traffic
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 3306
