apiVersion: v1
kind: Service
metadata:
  name: java-devops-service
  namespace: devops-production
  labels:
    app.kubernetes.io/name: java-devops-application
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: java-devops-application
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
